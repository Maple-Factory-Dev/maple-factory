<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Maple Factory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23d24e26'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/"><span class="leaf"></span><span id="org">Maple Factory</span></a>
  <nav aria-label="Main">
    <a href="#/" data-nav="inbox" title="Inbox" aria-label="Inbox"><span class="nav-icon" data-icon="inbox"></span><span class="nav-label">Inbox</span><span class="count" id="inbox-count"></span></a>
    <a href="#/tasks" data-nav="tasks" title="Tasks" aria-label="Tasks"><span class="nav-icon" data-icon="list-checks"></span><span class="nav-label">Tasks</span></a>
    <a href="#/machines" data-nav="machines" title="Machines" aria-label="Machines"><span class="nav-icon" data-icon="server"></span><span class="nav-label">Machines</span><span class="count online" id="machines-count"></span></a>
    <a href="#/notes" data-nav="notes" title="Scratchpad" aria-label="Scratchpad"><span class="nav-icon" data-icon="notebook-pen"></span><span class="nav-label">Scratchpad</span></a>
    <a href="#/settings" data-nav="settings" id="nav-settings" title="Settings" aria-label="Settings" hidden><span class="nav-icon" data-icon="settings"></span><span class="nav-label">Settings</span></a>
  </nav>
  <span class="status" id="status" title="Connection">Connecting…</span>
  <a class="btn primary small new" href="#/new" title="New task" aria-label="New task"><span class="new-icon" data-icon="plus"></span><span class="new-label">New task</span></a>
  <div class="account" id="account" hidden>
    <button type="button" class="account-btn" id="account-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" title="Account" aria-label="Account"><span class="account-avatar" id="account-avatar"></span></button>
    <div class="account-menu" id="account-menu" role="menu" aria-labelledby="account-btn" hidden>
      <div class="account-who" role="none"><strong id="account-name"></strong><span class="muted" id="account-login"></span></div>
      <button type="button" class="account-item" role="menuitem" id="account-signout"><span data-icon="log-out"></span>Sign out</button>
    </div>
  </div>
</header>
<div id="update" class="update-bar" role="status" hidden>
  <span>Maple Factory was updated. Refresh to get the latest version.</span>
  <button type="button" class="btn primary small" id="update-refresh">Refresh</button>
</div>
<div id="github-status" class="update-bar github-status" role="status" hidden>
  <span><span class="gh-icon" data-icon="circle-alert"></span><strong>GitHub is having issues</strong> <span id="github-status-detail"></span></span>
  <a id="github-status-link" href="https://www.githubstatus.com" target="_blank" rel="noopener">githubstatus.com ↗</a>
</div>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/app/sentry.js"></script>
<script type="module" src="/app/app.js"></script>
</body>
</html>
