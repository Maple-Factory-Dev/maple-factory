<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Maple Factory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23d24e26'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#/"><span class="leaf"></span><span id="org">Maple Factory</span></a>
  <nav>
    <a href="#/" data-nav="inbox">Inbox <span class="count" id="inbox-count"></span></a>
    <a href="#/tasks" data-nav="tasks">Tasks</a>
    <a href="#/machines" data-nav="machines" title="Machines online">Machines <span class="count online" id="machines-count"></span></a>
    <a href="#/notes" data-nav="notes">Scratchpad</a>
    <a href="#/settings" data-nav="settings" id="nav-settings" title="Settings" aria-label="Settings" hidden><svg class="gear" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6.6 1h2.8l.4 1.9c.4.2.8.4 1.1.6l1.8-.6 1.4 2.4-1.4 1.3a5 5 0 0 1 0 1.3l1.4 1.3-1.4 2.4-1.8-.6c-.3.3-.7.5-1.1.6L9.4 15H6.6l-.4-1.9c-.4-.2-.8-.4-1.1-.6l-1.8.6-1.4-2.4 1.4-1.3a5 5 0 0 1 0-1.3L1.9 6.8l1.4-2.4 1.8.6c.3-.3.7-.5 1.1-.6L6.6 1ZM8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"/></svg><span class="nav-label">Settings</span></a>
  </nav>
  <span class="status" id="status" title="Connection">Connecting…</span>
  <a class="btn primary small new" href="#/new" title="New task" aria-label="New task"><span class="new-plus" aria-hidden="true">+</span><span class="new-label">New task</span></a>
</header>
<div id="update" class="update-bar" role="status" hidden>
  <span>Maple Factory was updated. Refresh to get the latest version.</span>
  <button type="button" class="btn primary small" id="update-refresh">Refresh</button>
</div>
<div id="github-status" class="update-bar github-status" role="status" hidden>
  <span><span class="gh-dot" aria-hidden="true"></span><strong>GitHub is having issues</strong> <span id="github-status-detail"></span></span>
  <a id="github-status-link" href="https://www.githubstatus.com" target="_blank" rel="noopener">githubstatus.com ↗</a>
</div>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/app/sentry.js"></script>
<script type="module" src="/app/app.js"></script>
</body>
</html>
