# Releases maple-server to the feed (maplefactory.dev/releases): the loop-releases checks, a version bump
# committed to main, then scripts/release-server.mjs, which tags server-v<version> and publishes the
# signed bundle. RELEASING.md ("In CI") has the inputs and the secrets it reads.
name: Release maple-server

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [minor, patch]
        default: minor
      channel:
        description: Feed channel (latest.json or beta.json)
        type: choice
        options: [stable, beta]
        default: stable
      dry_run:
        description: Bump only locally, publish to a dir:feed uploaded as an artifact, push nothing
        type: boolean
        default: false
  workflow_call:
    # Callers pass `secrets: inherit`.
    inputs:
      bump:
        type: string
        default: minor
      channel:
        type: string
        default: stable
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      BUMP: ${{ inputs.bump }}
      CHANNEL: ${{ inputs.channel }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the inputs
        run: |
          case "$BUMP" in minor|patch) ;; *) echo "::error::bump is minor or patch, not '$BUMP'"; exit 1;; esac
          case "$CHANNEL" in stable|beta) ;; *) echo "::error::channel is stable or beta, not '$CHANNEL'"; exit 1;; esac

      # The App may push to main past its protection, and push tags; a dry run pushes nothing and
      # checks out with the workflow's own read-only token.
      - name: Mint the release App's token
        id: app
        if: inputs.dry_run != true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          fetch-depth: 0 # the server-v tags, and the history since the last one

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Git identity
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      # The loop-releases checks. Any failure ends the job here, before anything is bumped.
      - name: "Check: generated protocol types are up to date"
        run: node protocol/gen.ts && git diff --exit-code
      - name: "Check: typecheck"
        working-directory: server
        run: npx tsc --noEmit
      - name: "Check: web/app scripts parse"
        run: for f in server/web/app/*.js; do node --check "$f" || exit 1; done
      - name: "Check: server tests"
        working-directory: server
        run: npm test

      - name: Bump and commit
        id: bump
        run: |
          last=$(git describe --tags --abbrev=0 --match 'server-v*' 2>/dev/null || true)
          if [ -n "$last" ]; then
            subjects=$(git log --format=%s "$last..HEAD" -- server protocol | paste -sd ';' - | sed 's/;/; /g')
          else
            subjects=$(git log -n 20 --format=%s -- server protocol | paste -sd ';' - | sed 's/;/; /g')
          fi
          if [ -z "$subjects" ]; then
            if [ "$DRY_RUN" != true ]; then echo "::error::nothing changed in server/ or protocol/ since ${last}"; exit 1; fi
            subjects="no changes since ${last} (dry run)"
          fi
          short=$subjects
          if [ ${#short} -gt 200 ]; then short="${short:0:197}..."; fi

          version=$(cd server && npm version "$BUMP" --no-git-tag-version | sed 's/^v//')
          git add server/package.json package-lock.json
          git commit -q -m "maple-server ${version}: ${short}"
          echo "Bumped to ${version} (last release ${last:-none})."

          {
            echo "version=${version}"
            echo "last=${last}"
            echo "subjects<<SUBJECTS_EOF"
            echo "$subjects"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push the bump to main
        if: inputs.dry_run != true
        run: |
          for i in 1 2 3; do
            git fetch -q origin && git rebase -q origin/main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::couldn't push the bump to main after 3 tries"
          exit 1

      - name: Publish to the feed
        if: inputs.dry_run != true
        env:
          MAPLE_RELEASE_KEY_PEM: ${{ secrets.MAPLE_RELEASE_KEY_PEM }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          args=(--to feed)
          if [ "$CHANNEL" = beta ]; then args+=(--channel beta); fi
          node scripts/release-server.mjs "${args[@]}"

      - name: Check the tag and the feed
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/server-v${VERSION}"
          name=latest; if [ "$CHANNEL" = beta ]; then name=beta; fi
          url="https://maplefactory.dev/releases/maple-server/${name}.json"
          for _ in $(seq 1 24); do
            got=$(curl -fsS "${url}?t=$(date +%s)" | jq -r .version || true)
            if [ "$got" = "$VERSION" ]; then echo "${url} lists ${VERSION}."; exit 0; fi
            echo "${url} lists ${got:-nothing} so far; waiting."
            sleep 5
          done
          echo "::error::${url} doesn't list ${VERSION} after 2 minutes"
          exit 1

      # A dir: feed never tags, so nothing leaves the runner except the artifact.
      - name: Publish to a dir feed (dry run)
        if: inputs.dry_run == true
        env:
          MAPLE_RELEASE_KEY_PEM: ${{ secrets.MAPLE_RELEASE_KEY_PEM }}
        run: |
          args=(--to "dir:${RUNNER_TEMP}/feed")
          if [ "$CHANNEL" = beta ]; then args+=(--channel beta); fi
          node scripts/release-server.mjs "${args[@]}"
          find "${RUNNER_TEMP}/feed" -type f | sort

      - name: Upload the dir feed
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: maple-server-${{ steps.bump.outputs.version }}-feed
          path: ${{ runner.temp }}/feed
          if-no-files-found: error

      - name: Job summary
        if: always() && steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SUBJECTS: ${{ steps.bump.outputs.subjects }}
        run: |
          name=latest; if [ "$CHANNEL" = beta ]; then name=beta; fi
          if [ "$DRY_RUN" = true ]; then
            tag="not tagged (dry run)"
            feed="artifact \`maple-server-${VERSION}-feed\` (${name}.json)"
          else
            tag="\`server-v${VERSION}\`"
            feed="https://maplefactory.dev/releases/maple-server/${name}.json"
          fi
          {
            echo "## maple-server ${VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${tag} |"
            echo "| Channel | ${CHANNEL} |"
            echo "| Feed | ${feed} |"
            echo
            echo "**Shipped:**"
            echo
            echo "$SUBJECTS" | tr ';' '\n' | sed 's/^ *//; /^$/d; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
