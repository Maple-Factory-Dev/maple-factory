# Builds the Mac app and runs the MapleKit tests on a macOS runner (MF-337).
# Turned off for now (MF-347): manual runs only. Start it from Actions › Mac › Run workflow,
# or `gh workflow run mac.yml`. A repo check line can still name this job
# (`[macos] swift test --filter MapleKitTests → gha:mac-build`), but the item stays open
# (waivable) until someone runs the workflow by hand.
# To turn it back on, restore the triggers under `on:`: `pull_request:` and `push: branches: [main]`.
# Locally: cd apps/mac && swift build && swift test --filter MapleKitTests
name: Mac

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-build:
    # The check run's name: what `→ gha:mac-build` refers to.
    name: mac-build
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - uses: actions/cache@v6
        with:
          path: apps/mac/.build
          key: mac-spm-${{ runner.os }}-${{ hashFiles('apps/mac/Package.resolved') }}
          restore-keys: mac-spm-${{ runner.os }}-
      - name: Build the Mac app
        run: swift build
      - name: MapleKit tests
        run: swift test --filter MapleKitTests
