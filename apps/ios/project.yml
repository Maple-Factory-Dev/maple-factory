# The iPhone app. `xcodegen generate` writes MapleFactory.xcodeproj from this (it isn't checked in);
# scripts/run-ios.sh does that, builds, and boots it in the simulator.
name: MapleFactory
options:
  bundleIdPrefix: dev.maplefactory
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator builds need no signing; device builds and TestFlight archives (scripts/testflight.sh) sign
    # with the team below.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TU4485Z3KR
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
packages:
  # The wire protocol, factory API and sign-in storage, shared with the Mac app.
  MapleKit:
    path: ../mac
  # Crash and error reports (ErrorReports.swift), the same release as the Mac app's.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.32.0
  # A live session's terminal (SessionTerminalView.swift), the same pin as apps/mac/Package.swift.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
targets:
  Maple Factory:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: MapleKit
        product: MapleKit
      - package: Sentry
        product: Sentry
      - package: SwiftTerm
        product: SwiftTerm
      - sdk: AVKit.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maplefactory.ios
        PRODUCT_NAME: Maple Factory
        PRODUCT_MODULE_NAME: MapleFactoryiOS
        TARGETED_DEVICE_FAMILY: "1"
        # The Sentry DSN step reads server/web/sentry.json and writes the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Push (PushNotifications.swift): Debug device builds talk to APNs' sandbox, archives (TestFlight,
        # the App Store) to production. Read by MapleFactory.entitlements' aps-environment.
        APS_ENVIRONMENT: production
      configs:
        Debug:
          APS_ENVIRONMENT: development
    # The APNs entitlement, so the phone gets a device token for the factory's push relay (MF-231).
    entitlements:
      path: Resources/MapleFactory.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    postBuildScripts:
      # Error reports go to Maple Factory's maple-ios Sentry project (ErrorReports.swift); debug builds send none.
      - name: Sentry DSN
        basedOnDependencyAnalysis: false
        script: |
          dsn=$(plutil -extract projects.ios.dsn raw "$SRCROOT/../../server/web/sentry.json")
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :MapleSentryDSN" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MapleSentryDSN string $dsn" "$plist"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Maple Factory
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # New task's PhotosPicker reads picks without asking; this covers any save to the library.
        NSPhotoLibraryUsageDescription: Photos and screenshots you attach to a task's brief.
        # HTTPS only (no custom crypto), so App Store Connect asks no export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A local dev factory is plain http (localhost:8788).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.maplefactory.ios
            CFBundleURLSchemes: [maplefactory]
  # Drives the app: against a live dev factory (UITests/Live*Tests.swift), and the demo (DeepLinkTests.swift).
  MapleFactoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Maple Factory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.maplefactory.ios.uitests
        TEST_TARGET_NAME: Maple Factory
schemes:
  Maple Factory:
    build:
      targets:
        Maple Factory: all
    test:
      targets: [MapleFactoryUITests]
