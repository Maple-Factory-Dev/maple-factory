<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple doc</title>
<!-- The docs editor with no feed chrome, for the Mac and iOS apps to host in a WKWebView (MF-361).
     Bridge: window.mapleDocs.load({ docId, token, me, members, tasks, threads?, demo? }), updateTasks(tasks), updateThreads(threads), updateDecisions(decisions),
     setTheme('light'|'dark'), exportMarkdown(), focus(), destroy(). Events (ready, status, peers, synced, theme, error, openTask, plus MF-364's
     command {command} for the app to relay to its socket and threads {open} for badges) go to
     window.webkit.messageHandlers.maple when it exists, else to the Android app's MapleAndroid.postMessage(json), else to window.parent via postMessage. See docs/planning-docs.md. -->
<link rel="stylesheet" href="editor.css">
<style>
  :root { --bg: #fdfcfb; --raised: #f4f2f3; --card: #ffffff; --text: #1d2025; --muted: #6a707a; --faint: #a9aeb6;
    --stroke: rgba(0,0,0,.08); --fill: rgba(0,0,0,.045); --accent: #d24e26; --merged: #14a866; --term: #15131a; --term-text: #d5d8dd;
    --mention: #d9488f; --mono: ui-monospace, "SF Mono", Menlo, monospace; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #18161c; --raised: #221f27; --card: #1f1c23; --text: #e4e6ea; --muted: #9096a0; --faint: #5d626c;
    --stroke: rgba(255,255,255,.07); --fill: rgba(255,255,255,.06); --accent: #ff7a48; --merged: #3dd68c; --mention: #f07ab4; color-scheme: dark; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  #doc { max-width: 1080px; margin: 0 auto; padding: 16px 16px 0; }
</style>
</head>
<body>
<div id="doc"></div>
<script type="module">
  const post = (type, data = {}) => {
    const msg = { type, ...data };
    try {
      if (window.webkit?.messageHandlers?.maple) window.webkit.messageHandlers.maple.postMessage(msg);
      // The bridge reaches every frame, so the app hands this frame a nonce with load() and hears nothing else without it.
      else if (window.MapleAndroid?.postMessage) window.MapleAndroid.postMessage(JSON.stringify({ ...msg, nonce: window.__mapleAndroidNonce }));
      else if (window.parent !== window) window.parent.postMessage({ source: "maple-docs", ...msg }, "*");
    } catch {}
    console.log("[maple-docs]", type, JSON.stringify(data));
  };
  let handle = null;
  let theme = new URLSearchParams(location.search).get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const applyTheme = (t) => { theme = t === "dark" ? "dark" : "light"; document.documentElement.dataset.theme = theme; handle?.setTheme(theme); };
  applyTheme(theme);

  let tasks = [];
  let threads = [];
  let decisions = [];
  // Make tasks (MF-368): goals the dialog can pick when the doc has none, and the doc's own goal.
  let goals = [];
  let docGoal = null;
  window.mapleDocs = {
    /** Opens a doc. `token` is the app's `mft_…` token, sent as the socket's `maple-token` subprotocol (no cookie
     *  needed); `me` {login, name, avatar}; `members` [{login, name, avatar}] and `tasks` [{id, title, state, goal, fromDoc}] feed the
     *  @ and # menus and MF-12 links. `demo` {markdown}: a local-only doc with no socket (the Mac app's signed-out mockup). */
    async load({ docId, token, me, members = [], tasks: list = [], threads: open = [], decisions: ds = [], goals: gs = [], docGoal: dg = null, demo = null }) {
      tasks = list;
      goals = gs ?? [];
      docGoal = dg ?? null;
      threads = open ?? [];
      decisions = ds ?? [];
      handle?.destroy();
      const { createDocEditor } = await import("./editor.bundle.js");
      handle = createDocEditor({
        el: document.getElementById("doc"),
        docId, token, theme, demo,
        me: me ?? { login: "me" },
        members: () => members,
        tasks: () => tasks,
        // Comments (MF-364): the app owns the socket; the rail's commands go out through it.
        threads: () => threads,
        sendThreadCommand: demo ? null : (command) => post("command", { command }),
        // Decisions (MF-367): the app's feed draws the cards; propose / edit / accept / reject go out the same way.
        decisions: () => decisions,
        sendDecisionCommand: demo ? null : (command) => post("command", { command }),
        goals: () => goals,
        docGoal: () => docGoal,
        onEvent: (type, data) => post(type, Array.isArray(data) ? { peers: data } : data),
      });
      return true;
    },
    setTheme: (t) => { applyTheme(t); post("theme", { theme }); },
    exportMarkdown: () => handle?.exportMarkdown() ?? null,
    /** Puts the caret at the end of the doc (MF-382): the apps call it on `synced` for a doc they just created. */
    focus: () => { handle?.focus(); return !!handle; },
    /** New task objects from the app's feed (MF-363): task embeds redraw in place. */
    updateTasks: (list) => { tasks = list ?? []; handle?.tasksChanged(); },
    /** Goals and the doc's goal (MF-368), for the Make tasks dialog's goal picker. */
    updateGoals: (list, goal) => { goals = list ?? []; docGoal = goal ?? null; },
    /** The doc's comment threads from the app's feed (MF-364): highlights and the rail redraw. */
    updateThreads: (list) => { threads = list ?? []; handle?.threadsChanged(); },
    /** The doc's decisions from the app's feed (MF-367): decision cards redraw. */
    updateDecisions: (list) => { decisions = list ?? []; handle?.decisionsChanged(); },
    destroy: () => { handle?.destroy(); handle = null; },
  };
  post("ready");
</script>
</body>
</html>
